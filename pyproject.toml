[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-prompt-injection-evaluation"
version = "0.1.0"
description = "A reproducible evaluation of trust-boundary prompting against indirect prompt injection in RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Usman Tariq"}]
dependencies = [
  "mlx==0.32.4",
  "mlx-lm==0.28.3",
  "huggingface-hub==2.2.0",
  "matplotlib==3.10.7",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "transformers==5.20.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
rag-pi-eval = "rag_injection_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
